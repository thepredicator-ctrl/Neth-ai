name: Build Windows EXE

on:
  push:
    tags: ["v*.*.*"]
    paths:
      - "windows/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: windows/NethAI
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # Install llama-cpp-python (CPU build for reliable CI; CUDA optional)
          pip install llama-cpp-python --prefer-binary
          pip install -r requirements.txt
          pip install pyinstaller psutil
          python -c "import llama_cpp; print('llama_cpp OK')"

      - name: Build with PyInstaller
        working-directory: windows/NethAI
        shell: pwsh
        run: |
          pyinstaller build.spec --clean --noconfirm
          ls dist

      - name: Verify executable
        working-directory: windows/NethAI
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Neth-AI-Windows-x64.exe")) {
            Write-Error "EXE not produced"
            exit 1
          }
          $size = (Get-Item "dist/Neth-AI-Windows-x64.exe").Length
          Write-Host "EXE size: $size bytes"
          if ($size -lt 5MB) {
            Write-Error "EXE too small - likely broken"
            exit 1
          }

      - name: Rename for release
        working-directory: windows/NethAI
        shell: pwsh
        run: |
          Copy-Item dist/Neth-AI-Windows-x64.exe Neth-AI-Windows-x64.exe
          Get-FileHash Neth-AI-Windows-x64.exe -Algorithm SHA256 | Format-List

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neth-AI-Windows-x64-exe
          path: windows/NethAI/Neth-AI-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30
